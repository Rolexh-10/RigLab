name: Deploy RigLab to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (no browsers needed for the build)
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Typecheck and unit tests
        run: npm run typecheck && npm run models:check && npm run test:unit
      - name: Build site (HTML + external GLB assets)
        run: npm run build
      - name: Assemble site
        run: |
          mkdir _site
          cp dist/riglab.html _site/index.html
          cp -r dist/assets _site/assets   # GLB models; URLs in the page are relative, so the /RigLab/ project path works
          test "$(ls _site/assets/models/*.glb | wc -l)" -gt 0
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
